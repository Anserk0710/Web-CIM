name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.3 / Node 24
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: cim_ci
          MYSQL_USER: cim_ci
          MYSQL_PASSWORD: cim_ci_password
          MYSQL_ROOT_PASSWORD: cim_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcim_ci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, zip
          coverage: none

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Generate application key
        run: php artisan key:generate

      - name: PHP formatting check
        run: composer lint

      - name: Install Node dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build

      - name: Backend tests
        run: php artisan test

      - name: Verify MySQL migration
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cim_ci
          DB_USERNAME: cim_ci
          DB_PASSWORD: cim_ci_password
        run: php artisan migrate --force