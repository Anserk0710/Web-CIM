name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.3 / Node 24 / MySQL 8.4
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cim_ci
      DB_USERNAME: cim_ci
      DB_PASSWORD: cim_ci_password

      SESSION_DRIVER: database
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

      DB_INTEGRATION_EXPECTED_ENGINE: MySQL
      DB_INTEGRATION_EXPECTED_VERSION_PREFIX: "8.4."

      E2E_USER_EMAIL: e2e@cim.test
      E2E_USER_PASSWORD: CimE2E-CI-Only-2026!
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

    services:
      mysql:
        image: mysql:8.4.11

        env:
          MYSQL_DATABASE: cim_ci
          MYSQL_USER: cim_ci
          MYSQL_PASSWORD: cim_ci_password
          MYSQL_ROOT_PASSWORD: cim_ci_root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcim_ci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, pcntl, zip
          coverage: none

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PHP platform
        run: composer check-platform-reqs

      - name: Generate application key
        run: php artisan key:generate

      - name: PHP formatting check
        run: composer lint

      - name: Install Node dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Migration from zero
        run: php artisan migrate:fresh --seed --force

      - name: Backend regression suite
        run: php artisan test

      - name: Prepare E2E account and taxonomy
        run: php artisan db:seed --class=E2ESeeder --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Laravel E2E server
        run: |
          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > storage/logs/e2e-server.log 2>&1 &

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          cat storage/logs/e2e-server.log
          exit 1

      - name: Playwright product smoke
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7