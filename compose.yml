name: cim-web

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - public_storage:/var/www/html/storage/app/public
      - private_storage:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cim

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - public_storage:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cim

  node:
    image: node:24.21.0-bookworm-slim
    working_dir: /var/www/html
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    profiles:
      - dev
    networks:
      - cim

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cim}
      MYSQL_USER: ${DB_USERNAME:-cim_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cim_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cim_root_local_password}
      TZ: Asia/Makassar
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - cim

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: "500"
      TZ: Asia/Makassar
    networks:
      - cim

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles:
      - e2e
    working_dir: /var/www/html
    environment:
      PLAYWRIGHT_BASE_URL: http://nginx
      E2E_USER_EMAIL: ${E2E_USER_EMAIL:-e2e@cim.test}
      E2E_USER_PASSWORD: ${E2E_USER_PASSWORD:-CimE2E-Local-Only-2026!}
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      - nginx
    ipc: host
    networks:
      - cim

networks:
  cim:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
  node_modules:
  public_storage:
  private_storage:
